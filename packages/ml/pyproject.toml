[project]
name = "plotward-ml"
version = "0.1.0"
description = "Embedding interface and implementations: image bytes in, vector out"
requires-python = ">=3.12"
dependencies = ["pillow>=10.4", "pillow-heif>=0.18"]

[project.optional-dependencies]
# Heavy; installed in the worker image. Tests use the color-histogram embedder instead.
clip = ["open_clip_torch>=2.26", "torch>=2.4", "torchvision>=0.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotward_ml"]
