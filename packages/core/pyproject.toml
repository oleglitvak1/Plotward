[project]
name = "plotward-core"
version = "0.1.0"
description = "Domain models, DB access and ingest for Plotward"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "pillow-heif>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotward_core"]
