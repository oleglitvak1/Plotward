# Run from the repo root:  docker compose -f infra/docker-compose.yml --env-file .env up --build
services:
  db:
    build: ./postgres
    environment:
      POSTGRES_USER: plotward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plotward}
      POSTGRES_DB: plotward
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plotward -d plotward"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLOTWARD_DATABASE_URL: postgresql+psycopg://plotward:${POSTGRES_PASSWORD:-plotward}@db:5432/plotward
      PLOTWARD_DATA_DIR: /data
      PLOTWARD_API_KEY: ${PLOTWARD_API_KEY:?set PLOTWARD_API_KEY in .env}
      PLOTWARD_GARDEN_NAME: ${PLOTWARD_GARDEN_NAME:-My garden}
      PLOTWARD_GARDEN_TIMEZONE: ${PLOTWARD_GARDEN_TIMEZONE:-America/Los_Angeles}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # Photos live outside the repo by default. Set PLOTWARD_DATA_HOST_DIR in .env to change it.
      - ${PLOTWARD_DATA_HOST_DIR:-${HOME}/plotward-data}:/data

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    depends_on:
      api:
        condition: service_healthy  # the api container applies the migrations
    restart: unless-stopped
    environment:
      PLOTWARD_DATABASE_URL: postgresql+psycopg://plotward:${POSTGRES_PASSWORD:-plotward}@db:5432/plotward
      PLOTWARD_DATA_DIR: /data
      PLOTWARD_EMBEDDER: ${PLOTWARD_EMBEDDER:-open_clip}
      PLOTWARD_GARDEN_NAME: ${PLOTWARD_GARDEN_NAME:-My garden}
      PLOTWARD_GARDEN_TIMEZONE: ${PLOTWARD_GARDEN_TIMEZONE:-America/Los_Angeles}
    volumes:
      - ${PLOTWARD_DATA_HOST_DIR:-${HOME}/plotward-data}:/data
      - hfcache:/hf

volumes:
  pgdata:
  hfcache:
